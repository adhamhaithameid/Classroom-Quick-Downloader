  "rollup": "^4.59.0"
  "web-ext-run>multimatch": "8.0.0"
  "node-forge@1.3.3": "1.4.0"
  "happy-dom": ">=21.0.4"
  "dompurify": ">=3.4.17"
  "zod": ">=4.6.6"
  "@vitest/mocker": ">=4.1.12"
  "picomatch@2.3.1": "2.3.2"
  "picomatch@4.0.3": "4.0.4"
  "devalue": "^5.9.2"
  "defu": "^6.1.5"
  "vite": "^8.3.4"
  "cookie": "0.7.2"
  "flatted": ">=3.4.2"
