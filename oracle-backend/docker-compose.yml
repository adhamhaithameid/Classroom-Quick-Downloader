# oracle-backend/docker-compose.yml
# For local development and easy deployment

services:
  oracle-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cqd-oracle-backend
    environment:
      - APP_ENV=${APP_ENV:-}
      - ADDR=:8080
      - DB_PATH=/data/analytics.db
      - STATIC_DIR=/app/static
      - GOOGLE_CREDS_PATH=${GOOGLE_CREDS_PATH:-/run/secrets/google-credentials.json}
      - DO_SHARED_SECRET=${DO_SHARED_SECRET:?DO_SHARED_SECRET is required}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD is required}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD is required}
      - ORACLE_AUDIT_CHECKPOINT_SECRET=${ORACLE_AUDIT_CHECKPOINT_SECRET:?ORACLE_AUDIT_CHECKPOINT_SECRET is required}
      # HTTPS hardening: required by production startup validation.
      # Keep PUBLIC_BASE_URL and CSRF_ALLOWED_ORIGINS aligned with your TLS hostname(s).
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-auto}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - CSRF_ALLOWED_ORIGINS=${CSRF_ALLOWED_ORIGINS:-}
      - POSTGRES_DSN=${POSTGRES_DSN:-}
      - STORAGE_WATERMARK_WARN=${STORAGE_WATERMARK_WARN:-70}
      - STORAGE_WATERMARK_CRITICAL=${STORAGE_WATERMARK_CRITICAL:-85}
      - STORAGE_WATERMARK_EMERGENCY=${STORAGE_WATERMARK_EMERGENCY:-92}
      - ORACLE_RETENTION_RAW_SNAPSHOTS_DAYS=${ORACLE_RETENTION_RAW_SNAPSHOTS_DAYS:-30}
      - ORACLE_PRIMARY_REGION=${ORACLE_PRIMARY_REGION:-primary}
      - ORACLE_DR_REGION=${ORACLE_DR_REGION:-warm-dr}
      - ORACLE_DR_REPLICA_LAG_SECONDS=${ORACLE_DR_REPLICA_LAG_SECONDS:--1}
      - ORACLE_DR_PROMOTION_MAX_LAG_SECONDS=${ORACLE_DR_PROMOTION_MAX_LAG_SECONDS:-300}
      - CLOUDFLARE_ANALYTICS_API_TOKEN=${CLOUDFLARE_ANALYTICS_API_TOKEN:-}
      - CLOUDFLARE_ANALYTICS_ACCOUNT_TAG=${CLOUDFLARE_ANALYTICS_ACCOUNT_TAG:-}
      - CLOUDFLARE_ANALYTICS_HOSTNAME=${CLOUDFLARE_ANALYTICS_HOSTNAME:-}
      - ORACLE_WEBSITE_TRAFFIC_SYNC_ENABLED=${ORACLE_WEBSITE_TRAFFIC_SYNC_ENABLED:-false}
      - ORACLE_WEBSITE_TRAFFIC_SYNC_INTERVAL_SECONDS=${ORACLE_WEBSITE_TRAFFIC_SYNC_INTERVAL_SECONDS:-3600}
      - ORACLE_WEBSITE_TRAFFIC_SYNC_LOOKBACK_HOURS=${ORACLE_WEBSITE_TRAFFIC_SYNC_LOOKBACK_HOURS:-48}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - DEPLOY_TIME=${DEPLOY_TIME:-}
    volumes:
      - oracle_data:/data
      - ${GOOGLE_CREDS_PATH_HOST:-/dev/null}:/run/secrets/google-credentials.json:ro
    # HTTPS-only hardening: keep backend HTTP bound to loopback only.
    # Keep host port private and non-public so Caddy can own public ingress.
    ports:
      - "127.0.0.1:18080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]      
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: cqd-oracle-proxy
    depends_on:
      oracle-backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      # OCI ingress currently blocks 443 on this host; keep HTTPS fallback on 8080.
      - "8080:8080"
    environment:
      - ORACLE_PUBLIC_HOSTNAME=${ORACLE_PUBLIC_HOSTNAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  oracle_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
