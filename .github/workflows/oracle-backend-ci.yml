name: Oracle Backend CI

on:
  push:
    paths:
      - "oracle-backend/**"
      - ".github/workflows/oracle-backend-ci.yml"
  pull_request:
    branches: [main, master, Not_Stable]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: oracle-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-tests:
    name: Oracle Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Oracle dashboard assets
        run: pnpm -C oracle-backend build:dashboard

      - name: Typecheck Oracle dashboard TS
        run: pnpm -C oracle-backend typecheck:dashboard

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Run Oracle heavy test matrix
        run: pnpm -C oracle-backend test:strict

      - name: Run go vet
        working-directory: oracle-backend
        run: go vet ./...

  oracle-migrations:
    name: Oracle Migration Bootstrap
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oracle_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oracle_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Oracle dashboard assets
        run: pnpm -C oracle-backend build:dashboard

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Run migration bootstrap tests
        working-directory: oracle-backend
        env:
          POSTGRES_DSN: postgres://postgres@localhost:5432/oracle_test?sslmode=disable
        run: |
          go test ./internal/db -run 'TestMigrationBootstrapCleanDatabases|TestInitPostgres_Smoke' -count=1 -v
          go test ./... -count=1

  oracle-runtime-smoke:
    name: Oracle Runtime API Matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Generate runtime smoke secrets
        run: |
          echo "ORACLE_SMOKE_DO_SHARED_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ORACLE_SMOKE_DASHBOARD_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ORACLE_SMOKE_SUPER_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ORACLE_SMOKE_ARCHIVER_SHARED_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ORACLE_SMOKE_AUDIT_CHECKPOINT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: oracle-backend
        env:
          ADDR: 127.0.0.1:18080
          DB_PATH: ${{ runner.temp }}/oracle-runtime-smoke.db
          STATIC_DIR: ./static
          DO_SHARED_SECRET: ${{ env.ORACLE_SMOKE_DO_SHARED_SECRET }}
          DASHBOARD_PASSWORD: ${{ env.ORACLE_SMOKE_DASHBOARD_PASSWORD }}
          SUPER_ADMIN_PASSWORD: ${{ env.ORACLE_SMOKE_SUPER_ADMIN_PASSWORD }}
          ARCHIVER_SHARED_SECRET: ${{ env.ORACLE_SMOKE_ARCHIVER_SHARED_SECRET }}
          ORACLE_AUDIT_CHECKPOINT_SECRET: ${{ env.ORACLE_SMOKE_AUDIT_CHECKPOINT_SECRET }}
          SESSION_COOKIE_SECURE: "false"
          ALLOW_INSECURE_COOKIES: "true"
          ORACLE_ALLOW_HTTP_STORE_URLS: "true"
        run: |
          set -euo pipefail
          go run ./cmd/app >"${RUNNER_TEMP}/oracle-runtime-smoke.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/oracle-runtime-smoke.pid"
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS "http://127.0.0.1:18080/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "1" ]]; then
            echo "oracle backend did not become healthy"
            cat "${RUNNER_TEMP}/oracle-runtime-smoke.log" || true
            exit 1
          fi

      - name: Run API matrix smoke
        working-directory: oracle-backend
        env:
          BASE_URL: http://127.0.0.1:18080
          DASHBOARD_PASSWORD: ${{ env.ORACLE_SMOKE_DASHBOARD_PASSWORD }}
          SUPER_ADMIN_PASSWORD: ${{ env.ORACLE_SMOKE_SUPER_ADMIN_PASSWORD }}
          ORACLE_ALLOW_HTTP_STORE_URLS: "true"
        run: ./scripts/api-matrix-smoke.sh

      - name: Dump runtime log on failure
        if: failure()
        run: |
          cat "${RUNNER_TEMP}/oracle-runtime-smoke.log" || true

      - name: Stop backend
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/oracle-runtime-smoke.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/oracle-runtime-smoke.pid")" 2>/dev/null || true
          fi

  oracle-security:
    name: Oracle Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Ensure no committed Google credential files
        run: |
          if git ls-files --error-unmatch "oracle-backend/google-credentials.json" >/dev/null 2>&1; then
            echo "oracle-backend/google-credentials.json must never be committed."
            exit 1
          fi

      - name: Install scanners
        working-directory: oracle-backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.23.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run gosec
        working-directory: oracle-backend
        run: |
          "$(go env GOPATH)/bin/gosec" -track-suppressions ./...

      - name: Run govulncheck
        working-directory: oracle-backend
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
