name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-main
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-deploy Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required GitHub secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORACLE_ENDPOINT: ${{ vars.ORACLE_ENDPOINT }}
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_WORKER_API_TOKEN:-}" ]; then
            echo "::error::Missing required Actions secret: set CLOUDFLARE_WORKER_API_TOKEN (recommended) or CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          required=(CLOUDFLARE_ACCOUNT_ID ORACLE_ENDPOINT PUBLIC_WORKER_BASE_URL PUBLIC_SITE_URL)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required Actions secret/variable: ${key}"
              exit 1
            fi
          done
          if [ -z "${CLOUDFLARE_WORKER_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_WORKER_API_TOKEN is not set; falling back to CLOUDFLARE_API_TOKEN."
          fi
          case "${PUBLIC_WORKER_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::PUBLIC_WORKER_BASE_URL must start with https://"
              exit 1
              ;;
          esac
          case "${PUBLIC_SITE_URL}" in
            https://*) ;;
            *)
              echo "::error::PUBLIC_SITE_URL must start with https://"
              exit 1
              ;;
          esac
          case "${ORACLE_ENDPOINT}" in
            https://*) ;;
            *)
              echo "::error::ORACLE_ENDPOINT must start with https://"
              exit 1
              ;;
          esac

      - name: Schema compatibility checks
        run: bash tools/check_schema_compat.sh

  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Worker test suite
        run: pnpm -C cloudflare-worker test

      - name: Worker static checks
        run: pnpm -C cloudflare-worker run validate

      - name: Deploy worker
        id: deploy_worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORACLE_ENDPOINT: ${{ vars.ORACLE_ENDPOINT }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          site_origin="$(printf '%s' "${PUBLIC_SITE_URL}" | sed -E 's#(https?://[^/]+).*#\1#')"
          cors_origins="${site_origin}"
          if [ "${site_origin}" != "https://classroom-quick-downloader-website.pages.dev" ]; then
            cors_origins="${cors_origins},https://classroom-quick-downloader-website.pages.dev"
          fi

          deploy_with_token() {
            local token="$1"
            local logfile="$2"
            set +e
            CLOUDFLARE_API_TOKEN="${token}" pnpm exec wrangler deploy \
              --var "ORACLE_ENDPOINT:${ORACLE_ENDPOINT}" \
              --var "ALLOW_INSECURE_ORACLE_ENDPOINT:false" \
              --var "CORS_ALLOWED_ORIGINS:${cors_origins}" \
              2>&1 | tee "${logfile}"
            local status="${PIPESTATUS[0]}"
            set -e
            return "${status}"
          }

          worker_token="${CLOUDFLARE_WORKER_API_TOKEN:-}"
          fallback_token="${CLOUDFLARE_API_TOKEN:-}"
          primary_token="${worker_token}"
          if [ -z "${primary_token}" ]; then
            primary_token="${fallback_token}"
          fi

          if [ -z "${primary_token}" ]; then
            echo "::error::No Cloudflare API token is available for worker deploy."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if deploy_with_token "${primary_token}" /tmp/wrangler-deploy.log; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$?"

          if grep -Eq 'code:[[:space:]]*10023|kv bindings require kv write perms' /tmp/wrangler-deploy.log; then
            if [ -n "${fallback_token}" ] && [ "${fallback_token}" != "${primary_token}" ]; then
              echo "::warning::Primary worker token lacks KV write permission; retrying deploy with fallback CLOUDFLARE_API_TOKEN."
              if deploy_with_token "${fallback_token}" /tmp/wrangler-deploy-fallback.log; then
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              status="$?"
              if grep -Eq 'code:[[:space:]]*10023|kv bindings require kv write perms' /tmp/wrangler-deploy-fallback.log; then
                echo "::warning::Worker deploy skipped: both tokens lack Workers KV write permission (code 10023). Existing deployment remains active."
                echo "deployed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "::warning::Worker deploy skipped: token missing Workers KV write permission (code 10023). Existing deployment remains active."
              echo "deployed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "deployed=false" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Post-deploy smoke checks
        env:
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOYED: ${{ steps.deploy_worker.outputs.deployed || 'false' }}
        run: |
          set -euo pipefail
          worker_base="${PUBLIC_WORKER_BASE_URL%/}"
          site_origin="$(printf '%s' "${PUBLIC_SITE_URL}" | sed -E 's#(https?://[^/]+).*#\1#')"
          if [ "${DEPLOYED}" != "true" ]; then
            echo "::notice::Deploy step skipped; running smoke checks against currently active Worker deployment."
          fi

          health_code="000"
          for _ in $(seq 1 20); do
            health_code="$(curl -sS -o /tmp/worker-health.json -w "%{http_code}" "${worker_base}/health" || true)"
            if [ "${health_code}" = "200" ]; then
              break
            fi
            sleep 3
          done
          if [ "${health_code}" != "200" ]; then
            echo "::error::Worker /health smoke check failed (HTTP ${health_code})"
            cat /tmp/worker-health.json || true
            exit 1
          fi

          auth_code="$(curl -sS -o /tmp/worker-auth.txt -w "%{http_code}" "${worker_base}/admin/website/status" || true)"
          if [ "${auth_code}" != "401" ] && [ "${auth_code}" != "403" ]; then
            echo "::error::Worker auth smoke check expected 401/403, got ${auth_code}"
            cat /tmp/worker-auth.txt || true
            exit 1
          fi

          snapshot_payload="$(curl -fsS "${worker_base}/api/public/website/snapshot")"
          echo "${snapshot_payload}" | grep -Eq '"schemaVersion"[[:space:]]*:[[:space:]]*"1"'

          event_id="gha-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ingest_payload="$(cat <<JSON
          {"schemaVersion":"1","sessionId":"gha-worker-smoke","pagePath":"/ci/smoke","events":[{"eventId":"${event_id}","eventType":"cta","action":"install_click","placement":"hero_install"}]}
          JSON
          )"
          ingest_response="$(curl -fsS -X POST "${worker_base}/api/public/website/events" \
            -H "Origin: ${site_origin}" \
            -H "Content-Type: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            --data "${ingest_payload}")"
          echo "${ingest_response}" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
