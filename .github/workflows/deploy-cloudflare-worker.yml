name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-main
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-deploy Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_WORKER_BASE_URL PUBLIC_SITE_URL)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required Actions secret/variable: ${key}"
              exit 1
            fi
          done
          case "${PUBLIC_WORKER_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::PUBLIC_WORKER_BASE_URL must start with https://"
              exit 1
              ;;
          esac
          case "${PUBLIC_SITE_URL}" in
            https://*) ;;
            *)
              echo "::error::PUBLIC_SITE_URL must start with https://"
              exit 1
              ;;
          esac

      - name: Schema compatibility checks
        run: bash tools/check_schema_compat.sh

  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Worker test suite
        run: pnpm -C cloudflare-worker test

      - name: Worker static checks
        run: pnpm -C cloudflare-worker run validate

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy
