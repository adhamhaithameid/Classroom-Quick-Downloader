name: Extension Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build from (e.g. v1.5.6)'
        required: true

permissions:
  contents: read

jobs:
  build-chrome:
    name: Build Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C extension run chrome

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-chrome
          path: extension/.output/chrome-mv3/
          retention-days: 30

  build-firefox:
    name: Build Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C extension run firefox

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-firefox
          path: extension/.output/firefox-mv2/
          retention-days: 30

  build-edge:
    name: Build Edge
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C extension run edge

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-edge
          path: extension/.output/edge-mv3/
          retention-days: 30

  publish-firefox:
    name: Publish to Firefox AMO
    needs: build-firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-firefox
          path: ./dist-firefox

      - name: Package XPI
        run: cd dist-firefox && zip -r ../dist-firefox.xpi .

      - name: Sign and Submit to AMO
        uses: trmcnvn/firefox-addon@0d05671269b82c69c3f22ed86d8e772e89d47cf4 # v1
        with:
          uuid: 'classroom-quick-downloader@adhamhaitham.dev'
          xpi: ./dist-firefox.xpi
          manifest: ./dist-firefox/manifest.json
          api-key: ${{ secrets.FIREFOX_API_KEY }}
          api-secret: ${{ secrets.FIREFOX_API_SECRET }}

  draft-release:
    name: Create GitHub Draft Release
    needs: [build-chrome, build-firefox, build-edge, publish-firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts

      - name: Package artifacts
        env:
          RELEASE_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd artifacts/dist-chrome && zip -r "../../cqd-chrome-${RELEASE_REF_NAME}.zip" . && cd ../..
          cd artifacts/dist-edge && zip -r "../../cqd-edge-${RELEASE_REF_NAME}.zip" . && cd ../..
          cd artifacts/dist-firefox && zip -r "../../cqd-firefox-${RELEASE_REF_NAME}.xpi" . && cd ../..

      - name: Create Draft Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            cqd-chrome-${{ github.event.inputs.tag || github.ref_name }}.zip
            cqd-edge-${{ github.event.inputs.tag || github.ref_name }}.zip
            cqd-firefox-${{ github.event.inputs.tag || github.ref_name }}.xpi
          body: |
            ## Distribution Checklist

            - [x] Firefox — auto-published to AMO ✅
            - [ ] Chrome — [upload here](https://chrome.google.com/webstore/devconsole) → upload `cqd-chrome-*.zip`
            - [ ] Edge — [upload here](https://partner.microsoft.com/en-us/dashboard/microsoftedge/overview) → upload `cqd-edge-*.zip`

            ## Artifacts
            All three browser builds are attached. Firefox is already published. Chrome and Edge require manual upload to their respective stores.
