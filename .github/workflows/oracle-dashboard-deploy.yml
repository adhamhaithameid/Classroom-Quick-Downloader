name: Deploy Oracle Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oracle-dashboard-main
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-deploy Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          required=(ORACLE_HOST ORACLE_SSH_KEY)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required Actions secret: ${key}"
              exit 1
            fi
          done

      - name: Schema compatibility checks
        run: bash tools/check_schema_compat.sh

  deploy:
    name: Deploy Oracle Backend on VM
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 45m
          script: |
            set -eu

            REPO_DIR="$HOME/Classroom-Quick-Downloader"
            if [ ! -d "$REPO_DIR/.git" ]; then
              git clone https://github.com/adhamhaithameid/Classroom-Quick-Downloader.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch --prune origin main
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout -f main
            else
              git checkout -f -b main origin/main
            fi
            git reset --hard origin/main

            cd oracle-backend
            if [ ! -f .env.production ]; then
              for candidate in ".env" "$HOME/oracle-backend/.env.production" "$HOME/oracle-backend/.env" "$HOME/Classroom-Quick-Downloader/.env.production"; do
                if [ -f "$candidate" ]; then
                  cp "$candidate" .env.production
                  echo "Recovered .env.production from $candidate"
                  break
                fi
              done
            fi
            if [ ! -f .env.production ]; then
              echo ".env.production is missing on the Oracle VM. Create it first."
              exit 1
            fi

            for key in APP_ENV ADDR DB_PATH STATIC_DIR DO_SHARED_SECRET DASHBOARD_PASSWORD SUPER_ADMIN_PASSWORD DANGER_PASSWORD ARCHIVER_SHARED_SECRET ORACLE_AUDIT_CHECKPOINT_SECRET PUBLIC_WEBSITE_ALLOWED_ORIGINS ORACLE_PUBLIC_HOSTNAME; do
              value="$(grep -E "^${key}=" .env.production | head -n1 | cut -d= -f2- || true)"
              if [ -z "${value}" ]; then
                echo "Missing required key in .env.production: ${key}"
                exit 1
              fi
            done
            app_env="$(grep -E '^APP_ENV=' .env.production | head -n1 | cut -d= -f2- || true)"
            app_env_lc="$(printf '%s' "${app_env}" | tr '[:upper:]' '[:lower:]')"
            if [ "${app_env_lc}" = "production" ] || [ "${app_env_lc}" = "prod" ]; then
              session_mode="$(grep -E '^SESSION_COOKIE_SECURE=' .env.production | head -n1 | cut -d= -f2- || true)"
              session_mode_lc="$(printf '%s' "${session_mode}" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

              if [ -z "${session_mode_lc}" ]; then
                printf 'SESSION_COOKIE_SECURE=auto\n' >> .env.production
              elif [ "${session_mode_lc}" = "true" ] || [ "${session_mode_lc}" = "auto" ]; then
                :
              else
                if grep -q '^SESSION_COOKIE_SECURE=' .env.production; then
                  sed -i 's#^SESSION_COOKIE_SECURE=.*#SESSION_COOKIE_SECURE=auto#' .env.production
                else
                  printf 'SESSION_COOKIE_SECURE=auto\n' >> .env.production
                fi
              fi
              final_session_mode="$(grep -E '^SESSION_COOKIE_SECURE=' .env.production | head -n1 | cut -d= -f2- || true)"
              echo "Using SESSION_COOKIE_SECURE=${final_session_mode} for production deploy."
            fi

            printf 'services:\n  oracle-backend:\n    env_file:\n      - .env.production\n' > docker-compose.runtime.override.yml

            SHA="$(cd .. && git rev-parse HEAD)"
            NOW="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            if grep -q '^GIT_COMMIT=' .env.production; then
              sed -i "s#^GIT_COMMIT=.*#GIT_COMMIT=${SHA}#" .env.production
            else
              printf '\nGIT_COMMIT=%s\n' "$SHA" >> .env.production
            fi
            if grep -q '^DEPLOY_TIME=' .env.production; then
              sed -i "s#^DEPLOY_TIME=.*#DEPLOY_TIME=${NOW}#" .env.production
            else
              printf 'DEPLOY_TIME=%s\n' "$NOW" >> .env.production
            fi

            cp .env.production .env
            chmod 600 .env.production .env docker-compose.runtime.override.yml

            export COMPOSE_PROJECT_NAME=oracle-backend
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.runtime.override.yml up -d --build --force-recreate oracle-backend caddy

            health_ok="false"
            for i in $(seq 1 60); do
              if docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.runtime.override.yml exec -T oracle-backend wget --no-verbose --tries=1 --spider "http://localhost:8080/health" >/dev/null 2>&1; then
                health_ok="true"
                echo "Oracle health check passed"
                break
              fi
              sleep 2
            done

            if [ "${health_ok}" != "true" ]; then
              echo "Oracle health check failed after deploy"
              docker logs --tail 120 cqd-oracle-backend || true
              docker logs --tail 120 cqd-oracle-proxy || true
              exit 1
            fi

            echo "Oracle deploy health gate passed (deep API smoke checks run in CI jobs)."
