name: Deploy Oracle Backend

on:
  push:
    branches: [ main ]
    paths:
      - "oracle-backend/**"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:

concurrency:
  group: deploy-oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            REPO_URL="https://github.com/adhamhaithameid/Classroom-Quick-Downloader.git"
            REPO_DIR="$HOME/Classroom-Quick-Downloader"
            LEGACY_DIR="$HOME/oracle-backend"
            TARGET_SHA="${{ github.sha }}"

            echo "📦 Starting deployment..."
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "🔧 Cloning repository into $REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            if [ -f "$LEGACY_DIR/.env" ] && [ ! -f "$REPO_DIR/oracle-backend/.env" ]; then
              echo "📥 Copying legacy .env into monorepo oracle-backend/.env"
              cp "$LEGACY_DIR/.env" "$REPO_DIR/oracle-backend/.env"
            fi

            if [ -f "$LEGACY_DIR/google-credentials.json" ] && [ ! -f "$REPO_DIR/oracle-backend/google-credentials.json" ]; then
              echo "📥 Copying legacy google-credentials.json into monorepo oracle-backend/"
              cp "$LEGACY_DIR/google-credentials.json" "$REPO_DIR/oracle-backend/google-credentials.json"
            fi

            cd "$REPO_DIR"
            echo "🔄 Pulling latest code..."
            git fetch --prune origin main
            if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              echo "⚠️ Could not find target SHA $TARGET_SHA locally, using origin/main"
              TARGET_SHA="origin/main"
            fi
            git checkout -f "$TARGET_SHA"
            git reset --hard "$TARGET_SHA"

            cd oracle-backend
            export GIT_COMMIT="$(git -C "$REPO_DIR" rev-parse HEAD)"
            export DEPLOY_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            echo "🛑 Stopping containers..."
            if docker compose version >/dev/null 2>&1; then
              docker compose down || true
              echo "🚀 Building and starting (docker compose)..."
              docker compose up -d --build --remove-orphans
            else
              docker-compose down || true
              echo "🚀 Building and starting (docker-compose)..."
              docker-compose up -d --build --remove-orphans
            fi

            echo "🧹 Cleaning up..."
            docker image prune -f

            echo "✅ Verifying health..."
            for attempt in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8080/health >/dev/null; then
                break
              fi
              sleep 5
            done
            curl -sf http://localhost:8080/health >/dev/null

            echo "✅ Deployed commit: $GIT_COMMIT at $DEPLOY_TIME"
            echo "🎉 Deployment complete!"

      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
