name: Socket Security

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  socket-security:
    runs-on: ubuntu-latest
    name: Scan Dependencies

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
      - name: Run Dependency Audits
        run: |
          pnpm -C extension audit
          pnpm -C cloudflare-worker audit
