name: Extension Stores — Automated Publish (all three)

# One-command, fully automated three-store publish. Future releases should
# go through THIS workflow, not the browser consoles.
#
# One-time owner setup (then never again):
#   Firefox/AMO — no setup: AMO_JWT_ISSUER / AMO_JWT_SECRET already exist.
#   Edge        — Partner Center → publish API → create API key, then add
#                 secrets EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_CLIENT_SECRET.
#   Chrome      — Google Cloud Console: enable Chrome Web Store API, create an
#                 OAuth client, mint a refresh token (chromewebstore scope;
#                 chrome-webstore-upload-cli README has the helper), then add
#                 secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN.
#
# Each store leg skips itself (with a loud notice) when its secrets are
# absent, so partial setups still publish what they can.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (tag or branch, e.g. v1.8.7)'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  build-chrome:
    name: Build Chrome zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension run chrome
      - run: cd extension/.output && zip -r ../../cqd-chrome.zip chrome-mv3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cqd-chrome-zip
          path: cqd-chrome.zip
          retention-days: 14

  build-edge:
    name: Build Edge zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension run edge
      - run: cd extension/.output && zip -r ../../cqd-edge.zip edge-mv3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cqd-edge-zip
          path: cqd-edge.zip
          retention-days: 14

  build-firefox:
    name: Build Firefox zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension run firefox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-firefox
          path: extension/.output/firefox-mv2/
          retention-days: 14

  publish-firefox-listed:
    name: Publish to AMO (listed)
    needs: build-firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-firefox
          path: ./dist-firefox
      - name: Package XPI under the versioned name the AMO tool expects
        run: |
          cd dist-firefox
          version=$(node -p "require('./manifest.json').version")
          zip -r "../classroom-quick-downloader-${version}-firefox.zip" .
          echo "AMO_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Sign and submit to AMO (listed channel)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: classroom-quick-downloader@adhamhaitham.dev
          AMO_CHANNEL: listed
          # AMO indexing can lag past the default 180s poll; give it room.
          AMO_POLL_TIMEOUT_MS: "600000"
        run: node extension/tools/sign-extension.mjs

  publish-edge:
    name: Publish to Edge Add-ons
    needs: build-edge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cqd-edge-zip
          path: ./
      - name: Publish via Edge Add-ons API
        if: ${{ secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_CLIENT_SECRET != '' }}
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          client-secret: ${{ secrets.EDGE_CLIENT_SECRET }}
          zip-path: ./cqd-edge.zip
      - name: Edge publish skipped (secrets not set yet)
        if: ${{ secrets.EDGE_CLIENT_ID == '' }}
        run: echo "::notice::Edge secrets not configured — add EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_CLIENT_SECRET to enable automated Edge publishing."

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build-chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cqd-chrome-zip
          path: ./
      - name: Publish via Chrome Web Store API
        if: ${{ secrets.CWS_REFRESH_TOKEN != '' }}
        uses: mnao305/chrome-extension-upload@e7dd8e69b4bb5ec34901b9a94f0cc4a7b47f56d8 # v5.0.0
        with:
          file-path: ./cqd-chrome.zip
          extension-id: oemoongiefmpmomjikcjmkkkhffcbdid
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true
      - name: CWS publish skipped (secrets not set yet)
        if: ${{ secrets.CWS_REFRESH_TOKEN == '' }}
        run: echo "::notice::CWS secrets not configured — add CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN to enable automated Chrome publishing."
