name: Extension Stores — Automated Publish (all three)

# One-command, fully automated three-store publish. Future releases should
# go through THIS workflow, not the browser consoles.
#
# One-time owner setup (then never again):
#   Firefox/AMO — no setup: AMO_JWT_ISSUER / AMO_JWT_SECRET already exist.
#   Edge        — Partner Center → publish API → create API key, then add
#                 secrets EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_CLIENT_SECRET.
#   Chrome      — Google Cloud Console: enable Chrome Web Store API, create an
#                 OAuth client, mint a refresh token (chromewebstore scope;
#                 chrome-webstore-upload-cli README has the helper), then add
#                 secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN.
#
# Each store leg skips itself (with a loud notice) when its secrets are
# absent, so partial setups still publish what they can.
#
# 2026-10-28 (production pipeline): this workflow is also `workflow_call`ed
# by production.yml after the strict gates + version preflight + human
# approval. Dispatch remains for emergencies but refuses non-production
# refs unless allow_non_production=true, and every publish leg carries
# `environment: production` — the approval click is mandatory on every
# path that reaches users. Per-store publish inputs (publish_cws/edge/amo)
# come from the preflight verdicts; a store whose version is already live
# or in review is never re-attempted (AMO version-exists 409 is a clean
# skip, matching the CWS/Edge parity below).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (tag or branch, e.g. production)'
        required: true
        default: 'production'
      allow_non_production:
        description: 'Explicitly allow publishing a ref other than production (emergency only)'
        type: boolean
        default: false
      publish_cws:
        description: 'Publish the Chrome Web Store leg'
        type: boolean
        default: true
      publish_edge:
        description: 'Publish the Edge Add-ons leg'
        type: boolean
        default: true
      publish_amo:
        description: 'Publish the Firefox/AMO leg'
        type: boolean
        default: true
      skip_gate:
        description: 'Skip the mega-e2e gate (only when production.yml already ran the full matrix)'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      allow_non_production:
        type: boolean
        default: false
      publish_cws:
        type: boolean
        default: true
      publish_edge:
        type: boolean
        default: true
      publish_amo:
        type: boolean
        default: true
      skip_gate:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # DISPATCH PREFLIGHT: emergency dispatches must target production (or
  # explicitly own the exception). workflow_call entries from production.yml
  # are exempt — the caller ran the full gates and preflight already.
  dispatch-preflight:
    name: Dispatch preflight (ref guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce production ref on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          REF="${{ github.event.inputs.ref }}"
          ALLOW="${{ github.event.inputs.allow_non_production }}"
          if [ "$REF" != "production" ] && [ "$ALLOW" != "true" ]; then
            echo "::error::Store publishes run only from the production branch. Re-dispatch with ref=production, or set allow_non_production=true for a declared emergency."
            exit 1
          fi
          if [ "$ALLOW" = "true" ] && [ "$REF" != "production" ]; then
            echo "::warning::NON-PRODUCTION emergency publish authorized by the dispatcher (ref=$REF). The environment approval still applies."
          fi
      - name: Called from production pipeline — ref guard already enforced upstream
        if: github.event_name == 'workflow_call'
        run: echo "ref=${{ inputs.ref }} (called by ${{ github.event.workflow_run.name || 'production pipeline' }}) — preflight owned by caller."

  # MEGA-E2E GATE (2026-10-25): no store dispatch may skip the quality
  # suite. CI-side scope is build+unit+golden+drift (the full browser matrix
  # runs in the CI matrix on push; the local-only legs — edge/firefox/live —
  # are recorded as skips in the report). A gate failure blocks every store.
  # Skippable only via skip_gate=true, which production.yml sets because its
  # stage 1 ran a strictly larger matrix on the same commit.
  mega-e2e-gate:
    needs: dispatch-preflight
    if: inputs.skip_gate != true
    name: Mega-E2E quality gate (pre-deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run mega-e2e gate (quick scope)
        run: node tools/mega-e2e/run.mjs --quick
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mega-e2e-report
          path: qa-artifacts/mega-e2e/

  build-chrome:
    needs: [dispatch-preflight, mega-e2e-gate]
    if: always() && needs.dispatch-preflight.result == 'success' && (needs.mega-e2e-gate.result == 'success' || needs.mega-e2e-gate.result == 'skipped')
    name: Build Chrome zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension run chrome
      - run: cd extension/.output && zip -r ../../cqd-chrome.zip chrome-mv3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cqd-chrome-zip
          path: cqd-chrome.zip
          retention-days: 14

  build-edge:
    needs: [dispatch-preflight, mega-e2e-gate]
    if: always() && needs.dispatch-preflight.result == 'success' && (needs.mega-e2e-gate.result == 'success' || needs.mega-e2e-gate.result == 'skipped')
    name: Build Edge zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension run edge
      - run: cd extension/.output && zip -r ../../cqd-edge.zip edge-mv3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cqd-edge-zip
          path: cqd-edge.zip
          retention-days: 14

  build-firefox:
    needs: [dispatch-preflight, mega-e2e-gate]
    if: always() && needs.dispatch-preflight.result == 'success' && (needs.mega-e2e-gate.result == 'success' || needs.mega-e2e-gate.result == 'skipped')
    name: Build Firefox zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C extension run firefox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-firefox
          path: extension/.output/firefox-mv2/
          retention-days: 14

  publish-firefox-listed:
    name: Publish to AMO (listed)
    environment: production
    needs: [mega-e2e-gate, build-firefox]
    if: always() && needs.build-firefox.result == 'success' && (needs.mega-e2e-gate.result == 'success' || needs.mega-e2e-gate.result == 'skipped') && inputs.publish_amo == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-firefox
          path: ./dist-firefox
      - name: Package XPI under the versioned name the AMO tool expects
        run: |
          cd dist-firefox
          version=$(node -p "require('./manifest.json').version")
          zip -r "../classroom-quick-downloader-${version}-firefox.zip" .
          echo "AMO_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Sign and submit to AMO (listed channel)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: classroom-quick-downloader@adhamhaitham.dev
          # 2026-10-25: AMO 404s GUID-form addon URLs; version endpoints are
          # addressed by slug (the create flow still uses the guid).
          AMO_ADDON_SLUG: classroom-quick-downloader
          AMO_CHANNEL: listed
          # The zip is packaged at the repo root above; the signer's default
          # search path (extension/.output) does not exist on the runner.
          AMO_XPI_PATH: classroom-quick-downloader-${{ env.AMO_VERSION }}-firefox.zip
          # AMO indexing can lag past the default 180s poll; give it room.
          AMO_POLL_TIMEOUT_MS: "600000"
        run: node extension/tools/sign-extension.mjs

  publish-edge:
    name: Publish to Edge Add-ons
    environment: production
    needs: [mega-e2e-gate, build-edge]
    if: always() && needs.build-edge.result == 'success' && (needs.mega-e2e-gate.result == 'success' || needs.mega-e2e-gate.result == 'skipped') && inputs.publish_edge == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cqd-edge-zip
          path: ./
      - name: Publish via Edge Add-ons API
        # secrets context is not available in step `if`; bridge via env.
        # wdzeng/edge-addon v2 contract: client-id + api-key (client-secret
        # input no longer exists in v2; create the API key in Partner Center).
        # A previous run's in-review submission returns 409 — that is a
        # clean skip (idempotent re-dispatch), never a failure.
        env:
          HAVE_EDGE: ${{ secrets.EDGE_CLIENT_ID != '' && secrets.EDGE_API_KEY != '' }}
        if: env.HAVE_EDGE == 'true'
        continue-on-error: true
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: ./cqd-edge.zip
      - name: Edge publish skipped (secrets not set yet)
        if: env.HAVE_EDGE != 'true'
        run: echo "::notice::Edge secrets not configured — add EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY to enable automated Edge publishing."

  publish-chrome:
    name: Publish to Chrome Web Store
    environment: production
    needs: [mega-e2e-gate, build-chrome]
    if: always() && needs.build-chrome.result == 'success' && (needs.mega-e2e-gate.result == 'success' || needs.mega-e2e-gate.result == 'skipped') && inputs.publish_cws == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CWS_CLIENT_ID_S: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET_S: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN_S: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cqd-chrome-zip
          path: ./
      - name: Upload + publish via Chrome Web Store API
        # Direct API script (replaces the mnao305 action): the CWS item
        # endpoint exposes no readable status, so in-review is classified
        # from the upload error itself — ITEM_NOT_UPDATABLE means the earlier
        # upload is in review, which is a clean skip, not a failure.
        env:
          CWS_CLIENT_ID_S: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET_S: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN_S: ${{ secrets.CWS_REFRESH_TOKEN }}
        if: env.CWS_REFRESH_TOKEN_S != ''
        run: |
          TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID_S" \
            -d client_secret="$CWS_CLIENT_SECRET_S" \
            -d refresh_token="$CWS_REFRESH_TOKEN_S" \
            -d grant_type=refresh_token | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then echo "::error::CWS token exchange failed"; exit 1; fi
          HTTP=$(curl -s -o /tmp/cws-upload-res.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T ./cqd-chrome.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/oemoongiefmpmomjikcjmkkkhffcbdid")
          echo "upload http=$HTTP"
          if [ "$HTTP" = "403" ] && grep -q "ITEM_NOT_UPDATABLE" /tmp/cws-upload-res.json; then
            echo "::notice::CWS 1.9.1 already in review — upload skipped."
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            cat /tmp/cws-upload-res.json
            exit 1
          fi
          PUB=$(curl -s -o /tmp/cws-pub-res.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/oemoongiefmpmomjikcjmkkkhffcbdid/publish?publishTarget=default")
          echo "publish http=$PUB"
          cat /tmp/cws-pub-res.json
          if [ "$PUB" != "200" ] && grep -qE "PUBLISH_ALREADY_QUEUED|ITEM_ALREADY_PUBLISHED" /tmp/cws-pub-res.json; then
            echo "::notice::CWS version already published/queued by a previous run — clean skip."
            exit 0
          fi
          [ "$PUB" = "200" ] || exit 1
      - name: CWS publish skipped (secrets not set yet)
        if: env.CWS_REFRESH_TOKEN_S == ''
        run: echo "::notice::CWS secrets not configured — add CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN to enable automated Chrome publishing."
