name: Codecov

on:
  push:
    branches: [main, master, Not_Stable]
  pull_request:
    branches: [main, master, Not_Stable]

concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-coverage:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: extension
            workdir: extension
            test-cmd: pnpm -C extension test:coverage
            coverage-file: extension/coverage/coverage-final.json
            flag: extension
          - name: cloudflare-worker
            workdir: cloudflare-worker
            test-cmd: pnpm -C cloudflare-worker test:coverage
            coverage-file: cloudflare-worker/coverage/coverage-final.json
            flag: cloudflare-worker

    name: Coverage — ${{ matrix.component.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests with Coverage
        run: ${{ matrix.component.test-cmd }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.component.coverage-file }}
          flags: ${{ matrix.component.flag }}
          fail_ci_if_error: true
          verbose: true
