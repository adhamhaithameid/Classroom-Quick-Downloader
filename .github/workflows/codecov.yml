name: Codecov

on:
  push:
    branches: [main, master, Not_Stable]
  pull_request:
    branches: [main, master, Not_Stable]

concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload-coverage:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          - name: extension
            workdir: extension
            test-cmd: pnpm -C extension test:coverage
            coverage-file: extension/coverage/coverage-final.json
            flag: extension
          - name: cloudflare-worker
            workdir: cloudflare-worker
            test-cmd: pnpm -C cloudflare-worker test:coverage
            coverage-file: cloudflare-worker/coverage/coverage-final.json
            flag: cloudflare-worker

    name: Coverage — ${{ matrix.component.name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests with Coverage
        run: ${{ matrix.component.test-cmd }}

      - name: Upload to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.component.coverage-file }}
          flags: ${{ matrix.component.flag }}
          fail_ci_if_error: true
          skip_validation: true
          verbose: true
