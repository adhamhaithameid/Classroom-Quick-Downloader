name: GitGuardian

on:
  push:
    branches: [main, master, Not_Stable]
  pull_request:
    branches: [main, master, Not_Stable]

permissions:
  contents: read

jobs:
  scanning:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: GitGuardian Scan
        uses: GitGuardian/ggshield-action@2002482fb5990b486be5598ebcf48a8eba393fce # v1
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        with:
          args: --ignore-known-secrets
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.base_ref }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
