name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10.28.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install

    - name: Run Cloudflare Worker Tests
      run: pnpm --filter cloudflare-worker test

    - name: Run Extension Tests
      run: pnpm -C extension test

    - name: Run Extension Typecheck
      run: pnpm -C extension compile

    - name: Enforce Extension Coverage Gates
      run: pnpm -C extension test:coverage:all

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.13'

    - name: Run Oracle Backend Tests
      run: go test ./...
      working-directory: oracle-backend

    # Make sure the script is executable (Linux permissions)
    - name: Make Script Executable
      run: chmod +x tools/validate.sh

    # Run the exact same script you use locally
    - name: Run Full Validation Suite
      run: ./tools/validate.sh
