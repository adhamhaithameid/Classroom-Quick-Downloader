name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10.28.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install

    - name: Run Cloudflare Worker Tests
      run: pnpm --filter cloudflare-worker test

    - name: Run Extension Tests
      run: pnpm -C extension test

    - name: Run Extension Typecheck
      run: pnpm -C extension compile

    - name: Enforce Extension Coverage Gates
      run: pnpm -C extension test:coverage:all

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.13'

    - name: Run Oracle Backend Tests
      run: go test ./...
      working-directory: oracle-backend

    # Make sure the script is executable (Linux permissions)
    - name: Make Script Executable
      run: chmod +x tools/validate.sh

    # Run the exact same script you use locally
    - name: Run Full Validation Suite
      run: ./tools/validate.sh

  gosec:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.13'

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@v2.23.0

    - name: Run gosec (triaged profile)
      working-directory: oracle-backend
      run: |
        # G701 is excluded because gosec taint analysis currently reports broad false positives
        # for static SQL with bound parameters in database/sql calls. See docs/security/gosec-triage.md.
        "$(go env GOPATH)/bin/gosec" -exclude=G701 -track-suppressions ./...

  oracle-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oracle_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oracle_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.13'

    - name: Run Migration Bootstrap + Tests
      working-directory: oracle-backend
      env:
        POSTGRES_DSN: postgres://postgres@localhost:5432/oracle_test?sslmode=disable
      run: |
        go test ./internal/db -run 'TestMigrationBootstrapCleanDatabases|TestInitPostgres_Smoke' -count=1 -v
        go test ./... -count=1
