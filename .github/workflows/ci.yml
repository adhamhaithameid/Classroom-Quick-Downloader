name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install

    # Make sure the script is executable (Linux permissions)
    - name: Make Script Executable
      run: chmod +x tools/validate.sh

    # Run the exact same script you use locally
    - name: Run Full Validation Suite
      run: ./tools/validate.sh