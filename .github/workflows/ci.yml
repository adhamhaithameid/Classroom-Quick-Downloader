name: CI

on:
  push:
    branches: [main, master, Not_Stable]
  pull_request:
    branches: [main, master, Not_Stable]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  attribution-guard:
    name: Attribution Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject blocked co-author trailers
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          blocked_name='[c]laude'
          pattern="(^co-authored-by:.*(${blocked_name}|anthropic\\.com)|noreply@anthropic\\.com)"

          # Guard incoming commits only: the previous tip on push, the PR base on pull_request.
          base=""
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          elif [ -n "$PR_BASE" ] && git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            base="$PR_BASE"
          fi

          if [ -z "$base" ]; then
            echo "::warning::No base revision available for this trigger; attribution scan skipped."
            exit 0
          fi

          matches="$(git log "$base..HEAD" --regexp-ignore-case --extended-regexp \
            --grep="$pattern" \
            --format='%H %s')"

          if [ -n "$matches" ]; then
            echo "::error::Blocked co-author trailers are not allowed in this repository."
            printf '%s\n' "$matches"
            exit 1
          fi

# ──────────────────────────────────────────────
# Extension
# ──────────────────────────────────────────────
  extension-tests:
    name: Extension — Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Extension Fixture Manifest Integrity
        run: |
          if [ -f extension/tests/classroom-fixture-manifest.test.ts ]; then
            pnpm -C extension run test:fixtures:manifest
          else
            echo "Fixture manifest integrity test is not present on this branch yet; skipping."
          fi

      - name: Run Extension Tests
        run: pnpm -C extension test

      - name: Run Extension Golden Regression Suites
        run: |
          if [ -f extension/tests/classroom-baseline-regression.test.ts ]; then
            pnpm -C extension run test:golden
          else
            echo "Golden regression suite is not present on this branch yet; skipping."
          fi

      - name: Run Extension Accuracy Gate
        run: |
          if [ -d extension/tests/accuracy/corpus ]; then
            pnpm -C extension run test:accuracy
          else
            echo "Accuracy corpus is not present on this branch yet; skipping."
          fi

      - name: Run Extension Typecheck
        run: pnpm -C extension compile

      - name: Enforce Extension Coverage Gates
        run: pnpm -C extension test:coverage:all

  # ──────────────────────────────────────────────
  # Extension E2E — real Chromium with the extension loaded
  #
  # These specs route https://classroom.google.com/** to local fixtures, so
  # they need no Google account. They must run headed (extension APIs are
  # unavailable in headless Chrome), hence xvfb on the Linux runner.
  #
  # This suite existed since 2026-03 but was unrunnable: @playwright/test had
  # been removed from devDependencies as "unused" while playwright.config.ts
  # and four specs still depended on it. Keeping it in CI stops that recurring.
  # ──────────────────────────────────────────────
  extension-e2e:
    name: Extension — Real Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Extension
        run: pnpm -C extension build

      - name: Run Extension E2E
        run: xvfb-run -a pnpm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Extension Build Matrix
  # ──────────────────────────────────────────────
  build-check:
    name: Build — ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Safari build temporarily disabled.
        target: [chrome, firefox, edge]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension (${{ matrix.target }})
        run: pnpm -C extension exec wxt build -b ${{ matrix.target }}

  # ──────────────────────────────────────────────
  # Website
  # ──────────────────────────────────────────────
  website-checks:
    name: Website — Check, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Website Typecheck
        run: pnpm -C website check

      - name: Run Website Visual Guardrails
        run: pnpm -C website test:visual-guards

      - name: Run Website Heavy Test Matrix
        run: pnpm -C website test:strict

      - name: Build Website
        run: pnpm -C website build

  # ──────────────────────────────────────────────
  # Cloudflare Worker
  # ──────────────────────────────────────────────
  cloudflare-worker-tests:
    name: Cloudflare Worker — Tests & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Cloudflare Worker Heavy Test Matrix
        run: pnpm -C cloudflare-worker test:strict

      - name: Run Static Analysis (Lint, Typecheck, Audit)
        run: pnpm -C cloudflare-worker run validate

  cloudflare-smoke:
    name: Cloudflare Worker — Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: cloudflare-worker-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Script Executable
        run: chmod +x tools/validate.sh

      - name: Run Full Validation Suite
        run: ./tools/validate.sh

  # ──────────────────────────────────────────────
  # Go — Security
  # ──────────────────────────────────────────────
  gosec:
    name: Go — Security Scan (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure no committed Google credential files
        run: |
          if git ls-files --error-unmatch "oracle-backend/google-credentials.json" >/dev/null 2>&1; then
            echo "oracle-backend/google-credentials.json must never be committed."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.23.0

      - name: Run gosec (triaged profile)
        working-directory: oracle-backend
        run: |
          "$(go env GOPATH)/bin/gosec" -track-suppressions ./...

  # ──────────────────────────────────────────────
  # Go — Oracle Backend Tests
  # ──────────────────────────────────────────────
  oracle-tests:
    name: Go — Oracle Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Oracle Dashboard Assets
        run: pnpm -C oracle-backend build:dashboard

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Run Oracle Backend Heavy Test Matrix
        run: pnpm -C oracle-backend test:strict

  # ──────────────────────────────────────────────
  # Go — Migration Smoke Test
  # ──────────────────────────────────────────────
  oracle-migration-smoke:
    name: Go — Migration Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: oracle_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d oracle_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Oracle Dashboard Assets
        run: pnpm -C oracle-backend build:dashboard

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Run Migration Bootstrap + Tests
        working-directory: oracle-backend
        env:
          POSTGRES_DSN: postgres://postgres@localhost:5432/oracle_test?sslmode=disable
        run: |
          go test ./internal/db -run 'TestMigrationBootstrapCleanDatabases|TestInitPostgres_Smoke' -count=1 -v
          go test ./... -count=1

  # ──────────────────────────────────────────────
  # Summary Gate (for branch protection)
  # ──────────────────────────────────────────────
  ci-passed:
    name: CI ✅
    if: always()
    needs:
      - attribution-guard
      - extension-tests
      - extension-e2e
      - build-check
      - website-checks
      - cloudflare-worker-tests
      - cloudflare-smoke
      - gosec
      - oracle-tests
      - oracle-migration-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          echo "Attribution Guard:      ${{ needs.attribution-guard.result }}"
          echo "Extension Tests:        ${{ needs.extension-tests.result }}"
          echo "Extension E2E:          ${{ needs.extension-e2e.result }}"
          echo "Build Check:            ${{ needs.build-check.result }}"
          echo "Website Checks:         ${{ needs.website-checks.result }}"
          echo "Worker Tests:           ${{ needs.cloudflare-worker-tests.result }}"
          echo "Worker Smoke:           ${{ needs.cloudflare-smoke.result }}"
          echo "gosec:                  ${{ needs.gosec.result }}"
          echo "Oracle Tests:           ${{ needs.oracle-tests.result }}"
          echo "Oracle Migration Smoke: ${{ needs.oracle-migration-smoke.result }}"

          if [[ "${{ needs.attribution-guard.result }}" != "success" ]] ||
             [[ "${{ needs.extension-tests.result }}" != "success" ]] ||
             [[ "${{ needs.extension-e2e.result }}" != "success" ]] ||
             [[ "${{ needs.build-check.result }}" != "success" ]] ||
             [[ "${{ needs.website-checks.result }}" != "success" ]] ||
             [[ "${{ needs.cloudflare-worker-tests.result }}" != "success" ]] ||
             [[ "${{ needs.cloudflare-smoke.result }}" != "success" ]] ||
             [[ "${{ needs.gosec.result }}" != "success" ]] ||
             [[ "${{ needs.oracle-tests.result }}" != "success" ]] ||
             [[ "${{ needs.oracle-migration-smoke.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi

          echo "All CI checks passed!"
