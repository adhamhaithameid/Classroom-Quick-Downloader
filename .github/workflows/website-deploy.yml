name: Deploy Website (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-cloudflare-pages
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-deploy Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          PUBLIC_ORACLE_API_BASE_URL: ${{ vars.PUBLIC_ORACLE_API_BASE_URL }}
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_PAGES_PROJECT_NAME
            PUBLIC_ORACLE_API_BASE_URL
            PUBLIC_WORKER_BASE_URL
            PUBLIC_SITE_URL
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required Actions secret/variable: ${key}"
              exit 1
            fi
          done
          for url_key in PUBLIC_ORACLE_API_BASE_URL PUBLIC_WORKER_BASE_URL PUBLIC_SITE_URL; do
            case "${!url_key}" in
              https://*) ;;
              *)
                echo "::error::${url_key} must start with https://"
                exit 1
                ;;
            esac
          done
          if [ "${PUBLIC_ORACLE_API_BASE_URL%/}" = "${PUBLIC_WORKER_BASE_URL%/}" ]; then
            echo "::warning::PUBLIC_ORACLE_API_BASE_URL equals PUBLIC_WORKER_BASE_URL. This is allowed when routing reads/writes by endpoint path."
          fi

      - name: Schema compatibility checks
        run: bash tools/check_schema_compat.sh

  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deploy target
        run: |
          echo "Deploying Cloudflare Pages project: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Website typecheck
        run: pnpm -C website check

      - name: Website visual guardrails
        run: pnpm -C website test:visual-guards

      - name: Website smoke tests
        run: pnpm -C website test:smoke

      - name: Build website
        env:
          PUBLIC_BASE_PATH: ""
          PUBLIC_ORACLE_API_BASE_URL: ${{ vars.PUBLIC_ORACLE_API_BASE_URL }}
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: pnpm -C website build

      - name: Deploy website artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.70.0 pages deploy website/build \
            --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}"

      - name: Post-deploy smoke checks
        env:
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          worker_base="${PUBLIC_WORKER_BASE_URL%/}"
          site_url="${PUBLIC_SITE_URL%/}"
          site_origin="$(printf '%s' "${PUBLIC_SITE_URL}" | sed -E 's#(https?://[^/]+).*#\1#')"

          site_code="$(curl -sS -o /tmp/website-home.txt -w "%{http_code}" "${site_url}" || true)"
          case "${site_code}" in
            200|301|302|307|308) ;;
            *)
              echo "::error::Website URL smoke check failed (HTTP ${site_code})"
              cat /tmp/website-home.txt || true
              exit 1
              ;;
          esac

          health_code="$(curl -sS -o /tmp/worker-health.json -w "%{http_code}" "${worker_base}/health" || true)"
          if [ "${health_code}" != "200" ]; then
            echo "::error::Worker /health smoke check failed (HTTP ${health_code})"
            cat /tmp/worker-health.json || true
            exit 1
          fi

          auth_code="$(curl -sS -o /tmp/worker-auth.txt -w "%{http_code}" "${worker_base}/admin/website/status" || true)"
          if [ "${auth_code}" != "401" ] && [ "${auth_code}" != "403" ]; then
            echo "::error::Worker auth smoke check expected 401/403, got ${auth_code}"
            cat /tmp/worker-auth.txt || true
            exit 1
          fi

          snapshot_payload="$(curl -fsS "${worker_base}/api/public/website/snapshot")"
          echo "${snapshot_payload}" | grep -Eq '"schemaVersion"[[:space:]]*:[[:space:]]*"1"'

          event_id="gha-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ingest_payload="$(cat <<JSON
          {"schemaVersion":"1","sessionId":"gha-website-smoke","pagePath":"/ci/smoke","events":[{"eventId":"${event_id}","eventType":"cta","action":"download_click","placement":"final_download"}]}
          JSON
          )"
          ingest_response="$(curl -fsS -X POST "${worker_base}/api/public/website/events" \
            -H "Origin: ${site_origin}" \
            -H "Content-Type: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            --data "${ingest_payload}")"
          echo "${ingest_response}" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'
