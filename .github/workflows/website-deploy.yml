name: Deploy Website (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-cloudflare-pages
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-deploy Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required GitHub secrets and variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          PUBLIC_ORACLE_API_BASE_URL: ${{ vars.PUBLIC_ORACLE_API_BASE_URL }}
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_PAGES_PROJECT_NAME
            PUBLIC_ORACLE_API_BASE_URL
            PUBLIC_WORKER_BASE_URL
            PUBLIC_SITE_URL
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required Actions secret/variable: ${key}"
              exit 1
            fi
          done
          for url_key in PUBLIC_ORACLE_API_BASE_URL PUBLIC_WORKER_BASE_URL PUBLIC_SITE_URL; do
            case "${!url_key}" in
              https://*) ;;
              *)
                echo "::error::${url_key} must start with https://"
                exit 1
                ;;
            esac
          done
          if [ "${PUBLIC_ORACLE_API_BASE_URL%/}" = "${PUBLIC_WORKER_BASE_URL%/}" ]; then
            echo "::warning::PUBLIC_ORACLE_API_BASE_URL equals PUBLIC_WORKER_BASE_URL. This is allowed when routing reads/writes by endpoint path."
          fi

      - name: Schema compatibility checks
        run: bash tools/check_schema_compat.sh

  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show deploy target
        run: |
          echo "Deploying Cloudflare Pages project: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Website typecheck
        run: pnpm -C website check

      - name: Website visual guardrails
        run: pnpm -C website test:visual-guards

      - name: Website smoke tests
        run: pnpm -C website test:smoke

      - name: Build website
        env:
          PUBLIC_BASE_PATH: ""
          PUBLIC_ORACLE_API_BASE_URL: ${{ vars.PUBLIC_ORACLE_API_BASE_URL }}
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
          PUBLIC_INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm -C website build

      - name: Deploy website artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pnpm -C cloudflare-worker exec wrangler pages deploy ../website/build \
            --project-name="${CLOUDFLARE_PAGES_PROJECT_NAME}" \
            --branch="${GITHUB_REF_NAME}"

      - name: Post-deploy smoke checks
        env:
          PUBLIC_WORKER_BASE_URL: ${{ vars.PUBLIC_WORKER_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          worker_base="${PUBLIC_WORKER_BASE_URL%/}"
          site_url="${PUBLIC_SITE_URL%/}"
          site_origin="$(printf '%s' "${PUBLIC_SITE_URL}" | sed -E 's#(https?://[^/]+).*#\1#')"
          legacy_site_origin="https://classroom-quick-downloader-website.pages.dev"

          # Cloudflare's edge applies IP-reputation challenges to datacenter
          # ASNs on the workers.dev subdomain, which 502s GHA runners while
          # residential IPs pass (bead q8o). A browser UA plus retries are the
          # code-side mitigation; the durable fix is a custom domain route or
          # WAF allowlist for CI (dashboard action).
          curl_ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36 CQD-CI/1.0"

          curl_worker() {
            # curl_worker <output-file> <curl args...> — retries only
            # server-side/network failures (5xx, 000); any 4xx is returned
            # immediately because callers expect specific codes (the auth
            # check wants 401/403).
            local out="$1"; shift
            local attempt code
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -A "${curl_ua}" -o "${out}" -w "%{http_code}" "$@" || true)"
              case "${code}" in
                000|5*)
                  echo "::warning::worker request ${*} got HTTP ${code} (attempt ${attempt}/5); retrying in 5s"
                  sleep 5
                  ;;
                *)
                  echo "${code}"; return 0
                  ;;
              esac
            done
            echo "${code}"; return 1
          }

          site_code="$(curl -sS -o /tmp/website-home.txt -w "%{http_code}" "${site_url}" || true)"
          case "${site_code}" in
            200|301|302|307|308) ;;
            *)
              echo "::error::Website URL smoke check failed (HTTP ${site_code})"
              cat /tmp/website-home.txt || true
              exit 1
              ;;
          esac

          if health_code="$(curl_worker /tmp/worker-health.json "${worker_base}/health")"; then
            :
          else
            echo "::error::Worker /health smoke check failed (HTTP ${health_code})"
            cat /tmp/worker-health.json || true
            exit 1
          fi

          if auth_code="$(curl_worker /tmp/worker-auth.txt "${worker_base}/admin/website/status")"; then
            case "${auth_code}" in
              401|403) ;;
              *)
                echo "::error::Worker auth smoke check expected 401/403, got ${auth_code}"
                cat /tmp/worker-auth.txt || true
                exit 1
                ;;
            esac
          else
            echo "::error::Worker auth smoke check unreachable (HTTP ${auth_code})"
            cat /tmp/worker-auth.txt || true
            exit 1
          fi

          if snapshot_code="$(curl_worker /tmp/worker-snapshot.json "${worker_base}/api/public/website/snapshot")"; then
            grep -Eq '"schemaVersion"[[:space:]]*:[[:space:]]*"1"' /tmp/worker-snapshot.json
          else
            echo "::error::Worker snapshot smoke check failed (HTTP ${snapshot_code})"
            cat /tmp/worker-snapshot.json || true
            exit 1
          fi

          event_id="gha-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ingest_payload="$(cat <<JSON
          {"schemaVersion":"1","sessionId":"gha-website-smoke","pagePath":"/ci/smoke","events":[{"eventId":"${event_id}","eventType":"cta","action":"download_click","placement":"final_download"}]}
          JSON
          )"

          post_ingest() {
            local origin="$1"
            # The ingest POST is the request the edge most aggressively 502s
            # for datacenter ASNs (bead q8o); retry with backoff + browser UA.
            local attempt
            for attempt in 1 2 3 4 5; do
              if curl -fsS -A "${curl_ua}" -X POST "${worker_base}/api/public/website/events" \
                -H "Origin: ${origin}" \
                -H "Content-Type: application/json" \
                -H "X-Requested-With: XMLHttpRequest" \
                --data "${ingest_payload}"; then
                return 0
              fi
              echo "::warning::ingest POST for origin ${origin} failed (attempt ${attempt}/5); retrying in 5s"
              sleep 5
            done
            return 1
          }

          if ! ingest_response="$(post_ingest "${site_origin}")"; then
            if [ "${site_origin}" != "${legacy_site_origin}" ]; then
              echo "::warning::Primary origin ingest smoke failed; checking legacy Pages origin for diagnostics."
              post_ingest "${legacy_site_origin}" >/tmp/legacy-origin-ingest-smoke.json || true
            fi
            echo "::error::Website ingest smoke check failed for origin ${site_origin}"
            exit 1
          fi
          echo "${ingest_response}" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'

      - name: Post-deploy production verification
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          # Full page-content + worker verification before search indexing runs.
          # Retries absorb edge propagation delay for the fresh deployment.
          for attempt in 1 2 3 4; do
            if node tools/verify-production.mjs; then
              echo "::notice::Post-deploy production verification passed (attempt ${attempt})."
              exit 0
            fi
            echo "::warning::verify-production attempt ${attempt} failed; retrying"
            sleep 30
          done
          echo "::error::Post-deploy production verification failed after retries"
          exit 1

      - name: Submit indexing notifications (Bing + Google)
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
          GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}
          INDEXING_STRICT: "0"
        run: node tools/submit-search-indexing.mjs
