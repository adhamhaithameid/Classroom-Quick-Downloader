name: Dependency Backlog Issue

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dependency-backlog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect outdated dependencies
        id: collect_outdated
        continue-on-error: true
        run: pnpm -r outdated --format json > outdated.json

      - name: Create or update dependency backlog issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          OUTDATED_STEP_OUTCOME: ${{ steps.collect_outdated.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const title = 'Dependency update backlog';
            const reportPath = 'outdated.json';
            const scanOutcome = process.env.OUTDATED_STEP_OUTCOME;

            let raw = '';
            try {
              raw = fs.readFileSync(reportPath, 'utf8').trim();
            } catch (error) {
              if (scanOutcome !== 'success') {
                throw new Error(`Dependency scan failed and no report was generated: ${error.message}`);
              }
            }

            if (!raw && scanOutcome !== 'success') {
              throw new Error('Dependency scan failed and produced an empty report; leaving backlog issue untouched.');
            }

            let parsed = {};
            if (raw) {
              try {
                parsed = JSON.parse(raw);
              } catch (error) {
                throw new Error(`Dependency report is not valid JSON: ${error.message}`);
              }
            }

            const entries = Object.entries(parsed)
              .map(([name, meta]) => ({ name, ...(meta || {}) }))
              .sort((a, b) => a.name.localeCompare(b.name));

            const generatedAt = new Date().toISOString();
            const lines = [];
            lines.push('## Automated dependency report');
            lines.push('');
            lines.push(`Generated at: ${generatedAt}`);
            lines.push('');

            if (entries.length === 0) {
              lines.push('No outdated dependencies detected in tracked workspaces.');
            } else {
              lines.push(`Found ${entries.length} outdated package(s):`);
              lines.push('');
              for (const entry of entries) {
                const current = entry.current ?? 'unknown';
                const wanted = entry.wanted ?? 'unknown';
                const latest = entry.latest ?? 'unknown';
                const depType = entry.dependencyType ?? 'unknown';
                const dependents = Array.isArray(entry.dependentPackages) ? entry.dependentPackages : [];
                const scopes = dependents
                  .map((pkg) => pkg?.location || pkg?.name)
                  .filter(Boolean)
                  .join(', ');

                lines.push(`- \`${entry.name}\` (${depType}): current \`${current}\`, wanted \`${wanted}\`, latest \`${latest}\`${scopes ? ` — ${scopes}` : ''}`);
              }
            }

            lines.push('');
            lines.push('_This issue is auto-managed by `.github/workflows/dependency-backlog-issue.yml`._');
            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (entries.length === 0) {
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['dependencies']
            });
