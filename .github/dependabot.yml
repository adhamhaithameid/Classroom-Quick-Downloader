version: 2
updates:
  # npm dependencies for the extension
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "extension"
    open-pull-requests-limit: 0

  # npm dependencies for the cloudflare worker
  - package-ecosystem: "npm"
    directory: "/cloudflare-worker"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "worker"
    open-pull-requests-limit: 0

  # npm dependencies for the oracle backend
  - package-ecosystem: "npm"
    directory: "/oracle-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 0

  # Go modules for the oracle backend
  - package-ecosystem: "gomod"
    directory: "/oracle-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps/go)"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 0

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 0
