version: 2
updates:
  # npm dependencies for the extension
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "extension"
    open-pull-requests-limit: 10

  # npm dependencies for the cloudflare worker
  - package-ecosystem: "npm"
    directory: "/cloudflare-worker"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "worker"
    open-pull-requests-limit: 10

  # npm dependencies for the oracle backend
  - package-ecosystem: "npm"
    directory: "/oracle-backend"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 10
