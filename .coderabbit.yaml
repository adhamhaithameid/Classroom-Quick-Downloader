# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill" # Options: chill, default, assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - Not_Stable

chat:
  auto_reply: true

# Ignore specific paths from review
path_filters:
  - "!**/*.lock"
  - "!**/pnpm-lock.yaml"
  - "!**/package-lock.json"
  - "!**/*.min.js"
  - "!**/*.min.css"
  - "!**/dist/**"
  - "!**/.output/**"
