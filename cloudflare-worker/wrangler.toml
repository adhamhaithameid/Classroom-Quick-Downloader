name = "cqd-analytics"
main = "src/index.ts"
account_id = "fc9538cb362e6266eea89037f6347225"
compatibility_date = "2024-12-01"

[vars]
  # Configure a TLS-enabled Oracle base URL.
  # The worker appends "/ingest-batch" for flushes and "/api/public/website/*" for public reads.
  ORACLE_ENDPOINT = "https://oracle.example.com"
  MAX_BATCH_EVENTS = "10000"

[[durable_objects.bindings]]
  name = "DOWNLOADS_DO"
  class_name = "DownloadsDurable"

[[migrations]]
  tag = "v1"
  new_sqlite_classes = ["DownloadsDurable"]

[observability]
  enabled = true
  head_sampling_rate = 1

[observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true
  persist = true