name = "cqd-analytics"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
  # Production Oracle endpoint.
  # The worker appends "/ingest-batch" for flushes and "/api/public/website/*" for public reads.
  # Keep this HTTPS-only in committed config.
  # Current stable ingress uses :8080 because upstream OCI rules block :443.
  ORACLE_ENDPOINT = "https://129.151.233.229.nip.io:8080"
  # Temporary compatibility flag (keep false while HTTPS endpoint is healthy).
  # Set to "true" only for emergency HTTP fallback, then revert immediately.
  ALLOW_INSECURE_ORACLE_ENDPOINT = "false"
  # The worker appends "/ingest-batch" for flushes and "/api/public/website/*" for public reads.
  # Use DNS host (not raw IP) so Cloudflare fetch does not hit direct-IP egress restrictions.
  MAX_BATCH_EVENTS = "10000"
  # Website writes (telemetry + uninstall feedback) are origin-gated.
  # Keep this synced with your active website domains.
  CORS_ALLOWED_ORIGINS = "https://classroom-quick-downloader-website.pages.dev"
  # Free-tier default keeps queue-first pipeline disabled.
  ENABLE_SITE_QUEUE_PIPELINE = "false"

# These Cloudflare resource IDs are deployment metadata for existing bindings,
# not runtime secrets. They stay committed so Wrangler can bind the Worker to
# the correct KV/D1 resources during deploys.
[[kv_namespaces]]
  binding = "SITE_SNAPSHOT_KV"
  id = "34a558d6cb094467b67a31465e09776b"
  preview_id = "78c3997a24a843eabdff73ed36cffa99"

[[d1_databases]]
  binding = "SITE_CACHE_DB"
  database_name = "cqd_site_cache"
  database_id = "b77cac38-4aec-46db-acb3-c9e35ff2868e"

[[durable_objects.bindings]]
  name = "DOWNLOADS_DO"
  class_name = "DownloadsDurable"

[[migrations]]
  tag = "v1"
  new_sqlite_classes = ["DownloadsDurable"]

[observability]
  enabled = true
  head_sampling_rate = 1

[observability.logs]
  enabled = true
  head_sampling_rate = 1
  invocation_logs = true
  persist = true

[triggers]
  crons = ["0 */3 * * *", "0 1-22/3 * * *"]
